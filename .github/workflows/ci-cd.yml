name: CI/CD SoundDay - Testing y Validación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-y-verificacion:
    name: Ejecutar Tests Unitarios Nativo Node
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar pruebas unitarias con node --test
        run: npm test
